{% extends "base.html" %}
{% block title %}{{ note.title }}{% endblock %}
{% block content %}
  <article class="note">
    <h1>{{ note.title }}</h1>
    <time>{{ note.created_at }}</time>
    <p>{{ note.body }}</p>
  </article>
  <p><a href="{{ url_for('index') }}">&larr; Back to all notes</a></p>
{% endblock %}
